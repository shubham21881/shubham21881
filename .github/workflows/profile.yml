name: Update profile README

on:
  schedule:
    - cron: '30 0 * * *' # daily, 06:00 IST (schedules only run on the default branch)
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main, readme-v2]
    paths:
      - README.md
      - scripts/**
      - assets/ascii-portrait-*.txt
      - .github/workflows/**

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Neofetch card & latest projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/neofetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
      - run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/neofetch-*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git push)
